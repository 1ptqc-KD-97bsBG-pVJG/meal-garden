<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meal Garden · 12 Unified v2</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#F5F0E4;--paper2:#ECE5D3;--card:#FCF9F2;--ink:#2A2A22;--ink2:#6A6453;--ink3:#9B937F;--line:#DFD6C2;
  --forest:#2F4A2E;--leaf:#5E8C3A;--lime:#C6DC6B;--limeL:#E9F1C4;--amber:#E0A034;--amberL:#F8E7BD;--clay:#C2553D;--clayL:#F3D6CC;--ice:#8FB3C9;--iceL:#DCEAF1;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#DDD4C0;color:var(--ink);font:15px/1.35 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:915px;background:var(--paper);overflow:hidden}
@media (min-width:470px) and (min-height:720px){#phone{border-radius:34px;box-shadow:0 30px 80px -30px #5a4a3270,0 0 0 10px #2A2A22;height:calc(100% - 40px)}}
.screen{position:absolute;inset:0 0 70px 0;overflow-y:auto;overflow-x:hidden;padding:38px 14px 70px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
#s-cook,#s-capture{inset:0;padding-bottom:16px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#moments{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:1px;padding:3px;border-radius:99px;background:#2A2A2216;backdrop-filter:blur(6px);font-size:10px;white-space:nowrap}
#moments button{padding:3px 7px;border-radius:99px;color:var(--ink2)}
#moments button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
#nav{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;justify-content:space-around;padding:0 4px 6px;background:var(--paper);border-top:1px solid var(--line);z-index:40}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink3);width:62px;position:relative}
#nav button.on{color:var(--forest);font-weight:600}
#nav .cap{width:56px;height:56px;border-radius:50%;background:var(--forest);color:var(--paper);justify-content:center;margin-top:-22px;box-shadow:0 8px 18px -6px #2F4A2E90;font-size:9.5px;gap:0}
#nav .badge{position:absolute;top:-4px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
#ask{position:absolute;right:12px;bottom:82px;z-index:41;display:flex;align-items:center;gap:6px;padding:9px 14px 9px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 16px -8px #0006;font-weight:600;font-size:13px;color:var(--forest)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.l{width:28px;height:28px}
h1{font:500 28px/1.05 var(--serif);margin:0;letter-spacing:-.01em}
h2{font:500 19px/1.15 var(--serif);margin:0}
.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.top{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.top .sp,.sp{flex:1}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;color:var(--ink2);width:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--paper2);font-size:12px;color:var(--ink2);white-space:nowrap}
.chip.amber{background:var(--amberL);color:#7A5410}.chip.clay{background:var(--clayL);color:#7E2E1E}.chip.lime{background:var(--limeL);color:var(--forest)}.chip.ice{background:var(--iceL);color:#2F5266}
.chip.unsure{background:none;border:1.5px dashed var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:14px;font-weight:600;font-size:14px;background:var(--paper2);color:var(--ink)}
.btn.pri{background:var(--forest);color:var(--paper)}
.btn.lime{background:var(--lime);color:var(--forest)}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45}
.btn.w{width:100%}
/* strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 8px;margin:0 -14px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.grp{flex:none}
.grp>.lab{margin:0 0 4px 2px;font-size:10px}
.grp>div{display:flex;gap:6px}
.pl{position:relative;width:62px;flex:none;text-align:center;font-size:10.5px;line-height:1.15;color:var(--ink2)}
.pl svg.p{width:62px;height:62px}
.pl span{display:block;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pl.new svg.p{animation:pop .6s ease}
.pl .bdg{position:absolute;top:-3px;right:-3px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--forest)}
.pl.empty svg.p circle{fill:none;stroke:var(--ink3);stroke-width:1.6;stroke-dasharray:4 4}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
/* ranges */
.rb{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;margin-top:9px;font-size:12.5px}
.rb .tr{position:relative;height:16px;border-radius:8px;background:var(--paper2)}
.rb .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:8px 0 0 8px;background:var(--leaf)}
.rb .tr u{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(115deg,var(--lime) 0 4px,#DCE9A2 4px 8px)}
.rb .tr em{position:absolute;top:-3px;bottom:-3px;border-left:2px dotted var(--ink3)}
.rb b{grid-column:2;font-weight:600;font-size:12px;color:var(--ink2);margin-top:-5px}
/* basket & week */
.fd{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink3)}
.wk .col{width:100%;height:92px;border-radius:10px;background:var(--paper);display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding:4px 0;overflow:hidden}
.wk .col.none{background:none;border:1.5px dashed var(--line);justify-content:center}
.wk .col i{width:9px;height:9px;border-radius:50%;flex:none}
.wk .td{color:var(--forest);font-weight:700}
/* kitchen */
.kwrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:#F1EADB}
.kmap{width:100%;height:auto}
.kmap text{font:600 7px var(--sans);fill:#857C68;letter-spacing:.04em}
.kmap .it{cursor:pointer}
.kmap .it.toss{animation:toss .5s ease-in forwards}
.kmap .it.gone{animation:gone .45s ease forwards}
.kmap .it.ping .halo{animation:ping .6s ease}
.kmap .it{transform-box:fill-box;transform-origin:50% 100%}
@keyframes toss{to{transform:translateY(40px) rotate(25deg);opacity:0}}
@keyframes gone{to{transform:scale(.4);opacity:0}}
@keyframes ping{50%{transform:scale(1.5)}}
.halo{transform-box:fill-box;transform-origin:center}
.glow{fill:#C6DC6B33;stroke:var(--lime);stroke-width:2.5;opacity:0}
.use .glow{opacity:1;animation:pulse 1.6s ease-in-out infinite}
.prop{opacity:0;transition:opacity .3s}.use .prop{opacity:1}
.steam{stroke:#fff;stroke-width:1.4;fill:none;opacity:.8;animation:steam 2s linear infinite}
@keyframes steam{from{transform:translateY(3px);opacity:.9}to{transform:translateY(-6px);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.tm{display:none}.tm.on{display:block}
.tm rect{fill:var(--forest)}.tm text{font:700 10px var(--sans);fill:#F5F0E4;text-anchor:middle;letter-spacing:0}
.tm.beep rect{fill:var(--amber);animation:pulse .5s 6}
.zrow{padding:10px 0;border-top:1px solid var(--line)}
.zrow:first-child{border-top:0}
.marks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mk{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border-radius:12px;background:var(--paper2);font-size:11.5px;font-weight:600}
.mk.guess{background:none;border:1.5px dashed var(--ink3)}
.mk.fine.sel,.mkc.fine{background:var(--limeL);color:var(--forest)}.mk.soon.sel,.mkc.soon{background:var(--amberL);color:#7A5410}
.mk.gone.sel,.mkc.gone{background:var(--paper2);color:var(--ink2)}.mk.toss.sel,.mkc.toss{background:var(--clayL);color:#7E2E1E}
.gl{width:34px;height:30px;flex:none}
.dots{display:flex;gap:5px}.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--forest)}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);margin-bottom:8px;width:100%;text-align:left}
.opt.sel{border-color:var(--forest);background:var(--limeL)}
.opt svg.b{width:58px;height:58px;flex:none}
.uses{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.uses .gl{width:26px;height:22px;border-radius:8px;background:var(--amberL)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:11px;color:var(--ink2)}
.days svg{width:54px;height:54px;margin:0 auto 2px}
/* recipe */
.hero{position:relative;height:200px;border-radius:22px;background:radial-gradient(circle at 50% 45%,#FBF6E8,#E8DEC6);display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.hero svg.b{width:176px;height:176px;filter:drop-shadow(0 10px 12px #5a4a3240)}
.hero .ph{position:absolute;right:10px;bottom:10px}
.nudge{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--limeL);margin-bottom:8px;font-size:13.5px;font-weight:600;color:var(--forest)}
.nudge.on{background:var(--forest);color:var(--paper)}
.ing{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.ing>div{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.2;min-width:0}
.ing b{display:block;font-size:13.5px}
.ing span{color:var(--ink2)}
.pie{width:30px;height:30px;flex:none}
.stepl{counter-reset:s;margin:10px 0 0;padding:0;list-style:none}
.stepl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.stepl li:before{counter-increment:s;content:counter(s);font:500 18px var(--serif);color:var(--leaf);width:16px}
.step-n{display:flex;align-items:center;gap:6px}
.stp{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:99px;background:var(--forest);color:var(--paper);font-size:12.5px;font-weight:600}
/* cook */
.big{font:500 32px/1.05 var(--serif);margin:8px 0 10px}
.amt{display:flex;flex-wrap:wrap;gap:7px}
.amt span{padding:7px 12px;border-radius:12px;background:var(--paper2);font-size:17px;font-weight:600}
.amt span.cue{background:var(--amberL);color:#7A5410}
.ctl{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.ctl .btn{padding:16px 10px;font-size:17px;border-radius:18px}
.sec{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sec button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;line-height:1.1}
.sec button[disabled]{opacity:.35}
.nextp{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;border:1.5px dashed var(--line);margin-top:8px;font-size:14px;color:var(--ink2)}
.stack{position:relative;height:120px;margin:6px auto 4px;width:150px}
.stack svg{position:absolute;left:25px;width:100px;height:100px;transition:all .35s}
.dest{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dest>div{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:10px 4px;text-align:center;font-size:12.5px;font-weight:600}
.dest svg{margin:0 auto}.dest b{display:block;font:500 30px var(--serif)}
.dest button.m{width:30px;height:26px;border-radius:9px;background:var(--paper2);margin-top:4px;font-weight:700}
/* capture */
.vf{position:relative;height:330px;border-radius:22px;background:radial-gradient(circle at 50% 55%,#5a5142,#2a261f);overflow:hidden;display:grid;place-items:center}
.vf svg.p{width:220px;height:220px}
.vf:before,.vf:after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fff8;}
.vf:before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}.vf:after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf.flash{animation:flash .25s}
@keyframes flash{50%{filter:brightness(2.4)}}
.modes{display:flex;gap:6px;justify-content:center;margin:10px 0}
.modes button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;width:60px;border-radius:14px;font-size:11px;font-weight:600;color:var(--ink2)}
.modes button.on{background:var(--forest);color:var(--paper)}
.shut{width:70px;height:70px;border-radius:50%;background:var(--card);border:5px solid var(--forest);margin:0 auto;display:block}
.thumbs{display:flex;gap:5px;min-height:44px;align-items:center}
.thumbs svg{width:42px;height:42px;border-radius:10px;background:#3a352b}
.wt{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px}
.wt input{width:54px;border:0;background:none;font-weight:700;font-size:16px;text-align:right;outline:0}
.shim{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--paper2),#F8F3E6,var(--paper2));background-size:200% 100%;animation:shim 1s linear infinite;margin:8px 0}
@keyframes shim{to{background-position:-200% 0}}
/* app */
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .2s}
.sw.on{background:var(--leaf)}.sw.on:after{left:21px}
.tile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.tile .art{width:46px;height:46px;border-radius:13px;background:var(--limeL);display:grid;place-items:center;color:var(--forest);flex:none}
.tile.off .art{background:var(--paper2);color:var(--ink3)}
.tile b{display:block;font-size:14.5px}
.sug{background:var(--forest);color:var(--paper);border:0}
.sug .chip{background:#ffffff22;color:var(--paper)}
/* sheet */
#scrim{position:absolute;inset:0;background:#2A2A2255;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--paper);border-radius:24px 24px 0 0;padding:8px 14px 20px;max-height:82%;overflow-y:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#toast{position:absolute;left:14px;right:14px;bottom:82px;z-index:80;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:13.5px;transform:translateY(150px);transition:transform .25s}
#toast.on{transform:none}
#toast button{color:var(--lime);font-weight:700}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.arow .ai{width:32px;height:32px;border-radius:10px;background:var(--paper2);display:grid;place-items:center;color:var(--forest);flex:none}
.arow small{color:var(--ink3);white-space:nowrap}
.ubtn{font-size:12px;font-weight:700;color:var(--forest);padding:5px 9px;border-radius:9px;background:var(--limeL);display:inline-flex;gap:3px;align-items:center}
.askin{display:flex;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.askin input{flex:1;border:0;background:none;outline:0;min-width:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:8px;padding:4px 10px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:11.5px;pointer-events:none;white-space:nowrap}
.rel{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#phone{overflow:clip}
#sheet{visibility:hidden;pointer-events:none}#sheet.on{visibility:visible;pointer-events:auto}
#toast{visibility:hidden;pointer-events:none}#toast.on{visibility:visible;pointer-events:auto}
/* Round 2 review: calm fronts, explicit controls at depth. */
#ask{width:42px;height:42px;justify-content:center;padding:0;border-radius:50%}
#moments button{padding:3px 6px}
.pl.stacked:before{content:"";position:absolute;inset:0 1px 24px -4px;border-radius:50%;border:1px solid var(--line);background:var(--card);transform:translate(-2px,3px);z-index:-1}
.pl.stacked{isolation:isolate;margin-left:4px}.pl .mult{position:absolute;left:0;top:43px;background:var(--forest);color:var(--paper);padding:2px 5px;border-radius:8px;font-size:11px;font-weight:700}
.pl .glass{position:absolute;bottom:20px;right:-2px;background:var(--card);border-radius:8px;border:1px solid var(--line);padding:2px;color:var(--forest)}
.pl.empty{margin-left:9px}.health-card{display:block;width:100%;text-align:left}.health-card .rb .tr em{display:none}
.markgroups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.markgroups .marks{grid-template-columns:1fr 1fr;margin-top:4px}.markgroups .lab{font-size:10px}
.knowledge{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);margin:8px 0}.knowledge .ic{color:var(--forest)}
.mk.guess{border:0;background:var(--paper2)}.mk .spark{position:absolute;right:4px;top:3px}.mk{position:relative;min-height:42px}
#item-panel{background:var(--card);border:1px solid var(--forest);border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 4px 12px #2F4A2E12}
#item-panel h2{font-size:20px}.qty{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.qty button{min-width:36px;min-height:34px;border-radius:10px;background:var(--paper2);font-weight:600;font-size:12px}.qty button.on{background:var(--forest);color:var(--paper)}.qty b{min-width:22px;text-align:center}
.receiptlink{font-size:12px;color:var(--forest);text-decoration:underline;text-underline-offset:3px}.zrow .row{flex-wrap:wrap}.assumption{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;margin:10px 0}
.change{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.change:first-of-type{border:0}.change small{display:block;color:var(--ink2);font-size:12px}.change.off{opacity:.6}
.amount-button{display:block;text-align:left;color:var(--forest);min-height:30px;font-size:12.5px;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}.amounts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.amounts button{padding:5px 8px;border-radius:9px;font-size:12px}.amounts button.on{background:var(--forest);color:var(--paper)}
.start-cooking{min-height:58px;font-size:18px}.step-body{flex:1;min-width:0}.step-icons{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;color:var(--forest)}.step-icons .gl{width:26px;height:24px}.shelfgroup{margin:14px 0;border-top:2px solid var(--line)}.shelfgroup:first-of-type{border-top:0}.plainlink{text-align:left;color:var(--forest);padding:12px 0;font-size:14px;font-weight:600}

function timelineGroups(L){const food=consumed(L).slice().sort((a,b)=>new Date(a.capturedAt)-new Date(b.capturedAt)),groups=[];
 food.filter(e=>e.kind!=='drink').forEach(e=>{const key=dishKey(e),g=groups.find(g=>g.key===key);if(g)g.entries.push(e);else groups.push({key,entries:[e],drinks:[]})});

let drag=null;
document.addEventListener('pointerdown',e=>{const source=e.target.closest('[data-drag="portion"]');if(!source||e.button>0)return;e.preventDefault();const clone=source.cloneNode(true);clone.classList.add('dragged');document.body.appendChild(clone);drag={clone,x:e.clientX,y:e.clientY};clone.style.transform=`translate(${e.clientX-42}px,${e.clientY-42}px)`;if(e.isTrusted)source.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.clone.style.transform=`translate(${e.clientX-42}px,${e.clientY-42}px)`;const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-destination]');$$('[data-destination]').forEach(d=>d.classList.toggle('drop',d===dest))});
function endDrag(e,cancel=false){if(!drag)return;const dest=!cancel&&document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-destination]');drag.clone.remove();drag=null;$$('[data-destination]').forEach(d=>d.classList.remove('drop'));if(dest)ACT.place(dest.dataset.destination)}
document.addEventListener('pointerup',e=>endDrag(e));document.addEventListener('pointercancel',e=>endDrag(e,true));
